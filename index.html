*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}

.keys{opacity:.7;font-size:.85rem;line-height:1.8;margin-top:22px;max-width:520px}
.big{font-size:clamp(30px,8vw,64px);font-weight:900;letter-spacing:4px}
#touch{position:absolute;inset:0;display:none;z-index:3}
#touch.on{display:block}
.tb{position:absolute;border-radius:50%;border:2px solid rgba(61,245,255,.6);background:rgba(61,245,255,.08);color:var(--cyan);font-weight:800;display:grid;place-items:center;font-size:13px;letter-spacing:.1em}

#twalk{right:24px;top:90px;width:64px;height:64px;border-color:rgba(255,210,61,.8);color:#FFD23D;background:rgba(255,210,61,.1)}

 if(P.hurt>0){const g=x.createRadialGradient(w/2,h/2,Math.min(w,h)*.25,w/2,h/2,Math.max(w,h)*.7);g.addColorStop(0,'rgba(255,0,40,0)');g.addColorStop(1,`rgba(255,0,40,${P.hurt*.7})`);x.fillStyle=g;x.fillRect(0,0,w,h)}
 if(P.pick>0){x.fillStyle=`rgba(255,210,61,${P.pick*.35})`;x.fillRect(0,0,w,h)}
 // scanlines + vignette
 x.fillStyle='rgba(0,0,0,.12)';for(let y=0;y<h;y+=3*DPR)x.fillRect(0,y,w,DPR);
 const vg=x.createRadialGradient(w/2,h/2,Math.min(w,h)*.35,w/2,h/2,Math.max(w,h)*.75);vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(10,0,20,.55)');x.fillStyle=vg;x.fillRect(0,0,w,h);
 /*A1 grain+flicker*/x.fillStyle='rgba(255,255,255,.035)';for(let i=0;i<140;i++)x.fillRect(Math.random()*w,Math.random()*h,DPR*1.5,DPR*1.5);if(Math.random()<.015){x.fillStyle='rgba(0,0,0,.25)';x.fillRect(0,0,w,h)}
 /*A2 low-HP pulse + warning*/if(P.hp<35&&P.hp>0){const pu=(Math.sin(G.t*6)+1)/2;const g2=x.createRadialGradient(w/2,h/2,Math.min(w,h)*.2,w/2,h/2,Math.max(w,h)*.7);g2.addColorStop(0,'rgba(120,0,0,0)');g2.addColorStop(1,`rgba(160,0,10,${.25+pu*.35})`);x.fillStyle=g2;x.fillRect(0,0,w,h);x.textAlign='center';x.font=`900 ${14*DPR}px system-ui`;x.fillStyle=`rgba(255,40,60,${.5+pu*.5})`;x.fillText('THE CLOWNS SMELL BLOOD',w/2,h*.16);
  G.hb=(G.hb||0)-.016;if(G.hb<=0){play('heart');G.hb=.9}}
 /*A3 zone title card*/if(G.mt>2.6&&G.t<4){const a=Math.min(1,(G.mt-2.6)*1.5);x.fillStyle=`rgba(0,0,0,${a*.55})`;x.fillRect(0,h*.36,w,h*.2);x.textAlign='center';x.font=`900 ${34*DPR}px Georgia,serif`;x.fillStyle=`rgba(255,210,61,${a})`;x.shadowColor='#b0001a';x.shadowBlur=24;x.fillText('SUNNFUN',w/2,h*.45);x.shadowBlur=0;x.font=`700 ${13*DPR}px system-ui`;x.fillStyle=`rgba(243,233,220,${a})`;x.fillText('NO ONE LEAVES THE PARK',w/2,h*.52)}}
// ================= FLOW =================
const $=id=>document.getElementById(id);let last=0,running=false;
function frame(t){requestAnimationFrame(frame);const dt=Math.min(.05,(t-last)/1000||0);last=t;if(!G||!running)return;
 if(!G.paused&&!G.done){update(dt);musicTick()}render();hud();
 const sh=G.shake*8;V.style.transform=sh>.2?`translate(${rnd(-sh,sh)}px,${rnd(-sh,sh)}px)`:''}
requestAnimationFrame(frame);
function startLevel(n,fresh){lvl=n;loadLevel(n,fresh);running=true;['title','dead','clear','pause'].forEach(i=>$(i).classList.remove('on'));
 if(!touchMode&&V.requestPointerLock)try{V.requestPointerLock()}catch(e){}}
function saveKeep(){Object.assign(keep,{hp:Math.max(P.hp,50),arm:P.arm,ammo:{...P.ammo},has:[...P.has],w:P.w})}
function die(){G.done=true;if(document.exitPointerLock)document.exitPointerLock();setTimeout(()=>{$('dstat').textContent=`FLOOR ${lvl+1} · SCORE ${score}`;$('dead').classList.add('on')},900);
 if(A.ctx){const t=A.ctx.currentTime,o=out(0,.9);tone(o,t,'sawtooth',300,30,1.6,.5);noiseHit(o,t,1.2,'lowpass',2000,1,.6,80)}}
function finishLevel(){if(G.done)return;G.done=true;play('exit');saveKeep();const secs=((performance.now()-G.start)/1000)|0,bonus=Math.round(1000*G.kills/Math.max(1,G.total));score+=bonus;
 if(document.exitPointerLock)document.exitPointerLock();
 const lastF=lvl==LEVELS.length-1;$('ctitle').textContent=lastF?'YOU ESCAPED SUNNFUN':'FLOOR CLEARED';
 $('cstat').innerHTML=`KILLS ${G.kills}/${G.total} · TIME ${Math.floor(secs/60)}:${String(secs%60).padStart(2,'0')} · BONUS ${bonus}<br>SCORE ${score}`+(lastF?'<br>YOU WIN':'');
 $('bnext').textContent=lastF?'PLAY AGAIN':'DESCEND';try{const b=+localStorage.getItem('neoncrypt_best')||0;if(score>b)localStorage.setItem('neoncrypt_best',score)}catch(e){}
 setTimeout(()=>$('clear').classList.add('on'),600)}
$('bstart').onclick=()=>{audioInit();score=0;kills=0;startLevel(0,true)};
$('bres').onclick=()=>{audioInit();setPause(false);if(!touchMode&&V.requestPointerLock)V.requestPointerLock()};
$('bretry').onclick=()=>{audioInit();score=Math.max(0,score-500);startLevel(lvl,false)};
$('bnext').onclick=()=>{audioInit();if(lvl==LEVELS.length-1){score=0;startLevel(0,true)}else startLevel(lvl+1,false)};
document.addEventListener('pointerlockchange',()=>{if(document.pointerLockElement!==V&&G&&!G.done&&!G.paused&&running&&!touchMode)setPause(true)});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&G&&running)setPause(true)});
try{const b=+localStorage.getItem('neoncrypt_best')||0;if(b)document.getElementById('tbest').textContent='BEST '+b}catch(e){}
</script>
