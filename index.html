<script>
'use strict';
// ================= AUDIO =================
const A={ctx:null,music:true,step:0,next:0};
function audioInit(){if(A.ctx){A.ctx.resume();return}const C=window.AudioContext||window.webkitAudioContext;if(!C)return;const c=A.ctx=new C();
 A.comp=c.createDynamicsCompressor();A.comp.threshold.value=-14;A.comp.ratio.value=4;A.comp.connect(c.destination);
 A.master=c.createGain();A.master.gain.value=.8;A.master.connect(A.comp);
 A.sfx=c.createGain();A.sfx.gain.value=.9;A.sfx.connect(A.master);
 A.mus=c.createGain();A.mus.gain.value=.3;A.mus.connect(A.master);
 const len=c.sampleRate*2.2,ir=c.createBuffer(2,len,c.sampleRate);
 for(let ch=0;ch<2;ch++){const d=ir.getChannelData(ch);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,3)}
 A.rev=c.createConvolver();A.rev.buffer=ir;A.revIn=c.createGain();A.revIn.gain.value=.35;A.revIn.connect(A.rev);A.rev.connect(A.master);
 const nb=c.createBuffer(1,c.sampleRate,c.sampleRate),nd=nb.getChannelData(0);for(let i=0;i<nd.length;i++)nd[i]=Math.random()*2-1;A.noise=nb;
 A.next=c.currentTime+.1;
}
function out(pan,vol){const c=A.ctx,g=c.createGain();g.gain.value=vol;let n=g;
 if(c.createStereoPanner){const p=c.createStereoPanner();p.pan.value=Math.max(-1,Math.min(1,pan||0));g.connect(p);n=p}
 n.connect(A.sfx);n.connect(A.revIn);return g}
function env(g,t,a,d,peak){g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(peak,t+a);g.gain.exponentialRampToValueAtTime(0.0001,t+a+d)}
function noiseHit(dst,t,dur,type,f,q,peak,fEnd){const c=A.ctx,s=c.createBufferSource();s.buffer=A.noise;s.loop=true;
 const fl=c.createBiquadFilter();fl.type=type;fl.frequency.setValueAtTime(f,t);if(fEnd)fl.frequency.exponentialRampToValueAtTime(fEnd,t+dur);fl.Q.value=q;
 const g=c.createGain();env(g,t,.003,dur,peak);s.connect(fl);fl.connect(g);g.connect(dst);s.start(t,Math.random()*.5);s.stop(t+dur+.05)}
function tone(dst,t,type,f0,f1,dur,peak,a){const c=A.ctx,o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.setValueAtTime(f0,t);
 if(f1)o.frequency.exponentialRampToValueAtTime(f1,t+dur);env(g,t,a||.004,dur,peak);o.connect(g);g.connect(dst);o.start(t);o.stop(t+dur+.05)}
const SFX={
 pistol(){const t=A.ctx.currentTime,o=out(0,1);noiseHit(o,t,.18,'bandpass',1800,.8,.9,400);tone(o,t,'square',380,90,.12,.25)},
 shotgun(){const t=A.ctx.currentTime,o=out(0,1);noiseHit(o,t,.45,'lowpass',4000,.5,1.2,300);tone(o,t,'sine',120,38,.35,.9);
  noiseHit(o,t+.32,.06,'highpass',3000,1,.25);noiseHit(o,t+.42,.07,'highpass',2500,1,.25)},
 plasma(){const t=A.ctx.currentTime,o=out(0,.7);tone(o,t,'sawtooth',300,1400,.14,.25);tone(o,t,'square',900,200,.1,.12)},
 click(){const t=A.ctx.currentTime;tone(out(0,.5),t,'square',1200,600,.03,.2)},
 swap(){const t=A.ctx.currentTime,o=out(0,.6);noiseHit(o,t,.06,'highpass',2000,1,.4);noiseHit(o,t+.09,.06,'bandpass',1200,2,.4)},
 pickup(){const t=A.ctx.currentTime,o=out(0,.5);[523,659,784,1046].forEach((f,i)=>tone(o,t+i*.05,'triangle',f,0,.12,.35))},
 weapon(){const t=A.ctx.currentTime,o=out(0,.6);[392,523,659,784,1046,1318].forEach((f,i)=>tone(o,t+i*.06,'square',f,0,.14,.18))},
 key(){const t=A.ctx.currentTime,o=out(0,.6);[880,1175,1568].forEach((f,i)=>tone(o,t+i*.09,'sine',f,0,.4,.3))},
 door(p,v){const t=A.ctx.currentTime,o=out(p,v);noiseHit(o,t,.7,'lowpass',300,4,.8,900);tone(o,t,'sawtooth',55,70,.6,.15,.05)},
 locked(){const t=A.ctx.currentTime,o=out(0,.6);tone(o,t,'square',160,0,.12,.3);tone(o,t+.14,'square',120,0,.18,.3)},
 hurt(){const t=A.ctx.currentTime,o=out(0,.9);tone(o,t,'sawtooth',220,90,.25,.4);noiseHit(o,t,.15,'lowpass',900,1,.5)},
 growl(p,v,f){const c=A.ctx,t=c.currentTime,o=out(p,v),os=c.createOscillator(),lf=c.createOscillator(),lg=c.createGain(),fl=c.createBiquadFilter(),g=c.createGain();
  os.type='sawtooth';os.frequency.setValueAtTime(f,t);os.frequency.linearRampToValueAtTime(f*.6,t+.6);lf.frequency.value=28;lg.gain.value=f*.4;lf.connect(lg);lg.connect(os.frequency);
  fl.type='lowpass';fl.frequency.value=900;fl.Q.value=6;env(g,t,.05,.6,.6);os.connect(fl);fl.connect(g);g.connect(o);os.start(t);lf.start(t);os.stop(t+.7);lf.stop(t+.7)},
 epain(p,v){const t=A.ctx.currentTime,o=out(p,v);tone(o,t,'square',300,140,.15,.3);noiseHit(o,t,.1,'bandpass',700,2,.4)},
 edie(p,v){const t=A.ctx.currentTime,o=out(p,v);tone(o,t,'sawtooth',260,40,.8,.5);noiseHit(o,t,.5,'lowpass',1500,1,.6,120);tone(o,t+.1,'square',90,30,.6,.3)},
 fireball(p,v){const t=A.ctx.currentTime,o=out(p,v);noiseHit(o,t,.4,'bandpass',600,3,.6,2000);tone(o,t,'triangle',200,500,.3,.2)},
 boom(p,v){const t=A.ctx.currentTime,o=out(p,v);noiseHit(o,t,.5,'lowpass',2500,.7,.9,100);tone(o,t,'sine',90,30,.4,.7)},
 claw(p,v){const t=A.ctx.currentTime,o=out(p,v);noiseHit(o,t,.12,'highpass',2500,1,.6);noiseHit(o,t+.07,.1,'highpass',3500,1,.5)},
 step(){const t=A.ctx.currentTime,o=out((Math.random()-.5)*.3,.25);noiseHit(o,t,.06,'lowpass',260+Math.random()*80,2,.5)},
 exit(){const t=A.ctx.currentTime,o=out(0,.7);[262,330,392,523,659,784,1046].forEach((f,i)=>{tone(o,t+i*.08,'square',f,0,.25,.15);tone(o,t+i*.08,'triangle',f*2,0,.3,.12)})}
};
function play(n,...a){if(A.ctx)try{SFX[n](...a)}catch(e){}}
function play3d(n,x,y,extra){if(!A.ctx)return;const dx=x-P.x,dy=y-P.y,d=Math.hypot(dx,dy);if(d>18)return;
 let rel=Math.atan2(dy,dx)-P.a;rel=Math.atan2(Math.sin(rel),Math.cos(rel));play(n,Math.sin(rel)*.9,Math.min(1,1.6/(1+d*.35)),extra)}
// music: 132bpm darksynth loop, intensity follows combat
const PROG=[[45,57,60,64],[41,53,57,60],[43,55,59,62],[40,52,56,59]];const mf=n=>440*Math.pow(2,(n-69)/12);
function musicTick(){if(!A.ctx||!A.music||!G||G.paused)return;const c=A.ctx,spb=60/132/4;
 while(A.next<c.currentTime+.15){const s=A.step,t=A.next,bar=Math.floor(s/16)%4,ch=PROG[bar],i=s%16,m=A.mus,hot=G.heat>.3;
  if(i%4==0){tone(m,t,'sine',150,40,.22,.9);noiseHit(m,t,.03,'lowpass',800,1,.2)}
  if(i==4||i==12)noiseHit(m,t,.16,'bandpass',1800,.7,.45,900);
  if(hot||i%2==0)noiseHit(m,t,.03,'highpass',8000,1,i%4==2?.18:.08);
  const bn=ch[0]-12+(i%8==6?12:0);if(i%2==0||hot){const o=c.createOscillator(),f=c.createBiquadFilter(),g=c.createGain();o.type='sawtooth';o.frequency.value=mf(bn);
   f.type='lowpass';f.Q.value=8;f.frequency.setValueAtTime(hot?1400:700,t);f.frequency.exponentialRampToValueAtTime(140,t+spb*1.8);env(g,t,.005,spb*1.8,.35);o.connect(f);f.connect(g);g.connect(m);o.start(t);o.stop(t+spb*2)}
  if(i%16==0)ch.slice(1).forEach(n=>tone(m,t,'triangle',mf(n),0,spb*14,.05,.3));
  if(hot&&i%2==1){const n=ch[1+(s>>1)%3]+12;tone(m,t,'square',mf(n),0,spb*.9,.05)}
  A.step++;A.next+=spb}}
// ================= TEXTURES =================
const TS=64,rgb=(r,g,b)=>(0xff000000|(b<<16)|(g<<8)|r)>>>0;
function hexc(h){const n=parseInt(h.slice(1),16);return[n>>16,n>>8&255,n&255]}
function mkTex(fn){const c=document.createElement('canvas');c.width=c.height=TS;const x=c.getContext('2d');fn(x);return new Uint32Array(x.getImageData(0,0,TS,TS).data.buffer.slice(0))}
function grime(x,base,amt){x.fillStyle=base;x.fillRect(0,0,TS,TS);for(let i=0;i<500;i++){x.fillStyle=`rgba(${Math.random()<.5?0:255},${Math.random()<.5?0:200},255,${Math.random()*amt})`;x.fillRect(Math.random()*TS|0,Math.random()*TS|0,1+Math.random()*2|0,1)}}
function glowLine(x,c,x0,y0,x1,y1,w){x.strokeStyle=c;x.shadowColor=c;x.shadowBlur=6;x.lineWidth=w;x.beginPath();x.moveTo(x0,y0);x.lineTo(x1,y1);x.stroke();x.shadowBlur=0}
const TEX=[];
TEX[1]=mkTex(x=>{grime(x,'#161427',.06);x.fillStyle='#0c0b18';x.fillRect(0,30,64,4);x.fillRect(30,0,4,64);
 x.strokeStyle='#2a2650';x.strokeRect(2.5,2.5,26,26);x.strokeRect(35.5,35.5,26,26);x.strokeRect(35.5,2.5,26,26);x.strokeRect(2.5,35.5,26,26);
 glowLine(x,'#3DF5FF',6,16,24,16,2);glowLine(x,'#3DF5FF',40,48,58,48,2);for(const[a,b]of[[8,8],[56,8],[8,56],[56,56]]){x.fillStyle='#5b56a0';x.fillRect(a-1,b-1,3,3)}});
TEX[2]=mkTex(x=>{grime(x,'#2a0f2e',.05);for(let r=0;r<8;r++)for(let c=0;c<4;c++){const o=r%2?8:0;x.fillStyle=`hsl(${300+Math.random()*20},40%,${12+Math.random()*8}%)`;x.fillRect(c*16+o-15,r*8+1,15,6);x.fillRect(c*16+o+1,r*8+1,15,6)}
 glowLine(x,'#ff3df2',0,40,64,40,2);x.fillStyle='rgba(255,61,242,.25)';x.fillRect(0,36,64,9)});
TEX[3]=mkTex(x=>{grime(x,'#1d1a0a',.05);const g=x.createLinearGradient(0,0,0,64);g.addColorStop(0,'#3b3110');g.addColorStop(1,'#151206');x.fillStyle=g;x.fillRect(4,4,56,56);
 x.strokeStyle='#FFD23D';x.shadowColor='#FFD23D';x.shadowBlur=8;x.lineWidth=2;x.beginPath();x.arc(32,32,14,0,6.28);x.stroke();x.beginPath();x.moveTo(32,14);x.lineTo(32,50);x.moveTo(14,32);x.lineTo(50,32);x.stroke();x.shadowBlur=0});
TEX[4]=mkTex(x=>{grime(x,'#1b2230',.05);for(let i=0;i<64;i+=8){x.fillStyle=i%16?'#232c3d':'#1a2130';x.fillRect(0,i,64,8)}
 x.fillStyle='#FFD23D';for(let i=-64;i<64;i+=12){x.save();x.beginPath();x.rect(0,0,64,6);x.rect(0,58,64,6);x.clip();x.beginPath();x.moveTo(i,0);x.lineTo(i+6,0);x.lineTo(i+70,64);x.lineTo(i+64,64);x.fill();x.restore()}
 glowLine(x,'#3DFFB0',29,14,29,50,3);glowLine(x,'#3DFFB0',35,14,35,50,3)});
TEX[5]=mkTex(x=>{grime(x,'#300a14',.05);x.fillStyle='#14060a';x.fillRect(6,6,52,52);x.strokeStyle='#FF3D5A';x.shadowColor='#FF3D5A';x.shadowBlur=10;x.lineWidth=3;x.strokeRect(8,8,48,48);
 x.fillStyle='#FF3D5A';x.font='bold 22px system-ui';x.textAlign='center';x.fillText('KEY',32,40);x.shadowBlur=0});
TEX[6]=mkTex(x=>{grime(x,'#06221a',.05);x.fillStyle='#03140f';x.fillRect(4,4,56,56);x.fillStyle='#3DFFB0';x.shadowColor='#3DFFB0';x.shadowBlur=12;x.font='bold 19px system-ui';x.textAlign='center';x.fillText('EXIT',32,38);
 x.fillRect(10,46,44,3);x.fillRect(10,15,44,3);x.shadowBlur=0});
const FLOOR=mkTex(x=>{grime(x,'#0e0d1a',.05);x.strokeStyle='#1d1a35';x.lineWidth=2;x.strokeRect(1,1,62,62);x.strokeStyle='rgba(255,61,242,.35)';x.lineWidth=1;x.strokeRect(0.5,0.5,63,63)});
const CEIL=mkTex(x=>{grime(x,'#0a0912',.04);x.fillStyle='#14122a';x.fillRect(4,4,56,56);x.fillStyle='rgba(61,245,255,.55)';x.fillRect(24,28,16,8)});
// ================= SPRITES =================
function glow(x,c,b){x.shadowColor=c;x.shadowBlur=b}
function drawImp(x,f,col,dark){const bob=f==1?2:0;
 if(f==4){x.fillStyle=dark;x.beginPath();x.ellipse(32,58,22,5,0,0,6.28);x.fill();x.fillStyle=col;x.beginPath();x.ellipse(32,55,14,5,0,0,6.28);x.fill();glow(x,'#FF3D5A',6);x.fillStyle='#FF3D5A';x.fillRect(20,56,24,2);x.shadowBlur=0;return}
 x.fillStyle=dark;x.fillRect(22,44,7,18-bob);x.fillRect(35,44+bob,7,18-bob);
 const g=x.createRadialGradient(32,30,4,32,32,20);g.addColorStop(0,col);g.addColorStop(1,dark);x.fillStyle=g;x.beginPath();x.ellipse(32,32+bob,16,18,0,0,6.28);x.fill();
 x.fillStyle=dark;const arm=f==2?-10:0;x.fillRect(10,26+bob+arm,8,18);x.fillRect(46,26+bob+arm,8,18);
